<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar</title>
	<link rel="stylesheet" href="../estilos/estilos.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <header id ="header">
            <h1 class="title">SHOES SHOP</h1>
            <nav>
                <ul class="is-flex">
                    <li><a class="button" href="..index.html">Inicio</a></li>
                    <li><a class="button" href="productos.html">Productos</a></li>
                    <li><a class="button" href="carrito.html">Carrito</a></li>
                    <li><a class="button" href="login.html">Login</a></li>
                </ul>
            </nav>
        </header>
	<form id="registro" class="has-text-centered">
        <h2 class="subtitle">Registro Shoes Shop</h2>
        <div>
            <input type="text" id="nombre" placeholder="Ingrese su nombre">
        </div>
        <br>
        <div>
            <input type="email" id="email" placeholder="Ingrese su correo">
        </div>
        <br>
        <div>
            <input type="password" id="password" placeholder="Ingrese su contraseña">
        </div>
        <br>
        <div>
            <input type="date" id="date" placeholder="Ingrese su fecha de nacimiento">
        </div>
        <br>
        <button type="submit" class="button is-primary">Registrarse</button>
    </form>
	<footer>
        © 2026 Shoes Shop
        </footer>
	<script src="../scripts/script.js"></script>
</body>
</html>
