<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shoes Shop</title>
    <!-- Correcto: Sale de 'OtrasPag' hacia la carpeta 'estilos' -->
    <link rel="stylesheet" href="../estilos/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <header id="header" class="has-text-centered">
        <!-- Se agrega el id="logo" para el script de Admin -->
        <h1 id="logo" class="title" style="cursor: pointer;">SHOES SHOP</h1>
        <nav>
            <ul class="is-flex is-justify-content-center">
                <!-- CORREGIDO: Se agregó la '/' entre '..' e 'index.html' -->

                <!-- Correctos: Enlaces internos dentro de 'OtrasPag' -->
                <li><a class="button" href="productos.html">Productos</a></li>
                <li><a class="button" href="carrito.html">Carrito</a></li>
                <li><a class="button" href="signIn.html">Sing in</a></li>
                <li><a class="button" href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    <form id="login" class="has-text-centered my-5">
        <h2 class="subtitle">Iniciar Sesión</h2>
        <div>
            <input type="email" id="correo" placeholder="ingrese correo" required>
        </div>
        <br>
        <div>
            <input type="password" id="password" placeholder="Ingrese contraseña" required>
        </div>
        <br>
        <button type="submit" class="button is-primary">Iniciar</button>
        <p id="mensaje" class="mt-3"></p>
    </form>
    <footer class="has-text-centered">
        © 2026 Shoes Shop
    </footer>
    <!-- Correcto: Sale de 'OtrasPag' hacia la carpeta 'scripts' -->
    <script src="../scripts/script.js"></script>
