<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Shoes Shop</title>
    <!-- Correcto: Sale de 'OtrasPag' a buscar la carpeta 'estilos' -->
    <link rel="stylesheet" href="../estilos/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <header id="header">
        <!-- Se agregó id="logo" para la función de redirección admin -->
        <h1 id="logo" class="title" style="cursor: pointer;">SHOES SHOP</h1>
        <nav>
            <ul class="is-flex">
                <!-- Correcto: Vuelve a la raíz buscando 'index.html' -->
                <li><a class="button" href="../index.html">Inicio</a></li>
                <!-- Correctos: Enlaces a otras páginas dentro de la misma carpeta 'OtrasPag' -->
                <li><a class="button" href="productos.html">Productos</a></li>
                <li><a class="button" href="carrito.html">Carrito</a></li>
                <li><a class="button" href="signIn.html">Sing in</a></li>
                <li><a class="button" href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    <section id="carrito" class="section has-text-centered">
        <div class="container has-text-centered">
            <h2 class="title is-3">Tu Carrito de Compras</h2>

            <!-- Aquí el JS inyectará los productos centrados -->
            <div id="contenedor-carrito" class="is-flex is-flex-wrap-wrap is-justify-content-center my-5"></div>

            <div class="resumen-pago mt-4">
                <p id="total-precio" class="subtitle is-4">Total: $0</p>
                <div class="buttons is-centered">
                    <button class="button is-warning" onclick="vaciarCarrito()">Vaciar Carrito</button>
                    <button class="button is-success">Finalizar Compra</button>
                </div>
            </div>
        </div>
    </section>

    <!-- CORREGIDO: Se agregó la '/' entre '..' y 'scripts' -->
    <script src="../scripts/script.js"></script>
</body>
</html>
